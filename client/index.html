<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argus — Australian energy facilities</title>
    <script>
      // Set the theme before first paint so the page doesn't flash light then dark
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch {
          // storage can throw in privacy modes; the system preference still applies
        }
        var dark = stored
          ? stored === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
